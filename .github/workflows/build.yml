# Trigger workflow re-detection
# Trigger Actions enable
name: Build payload

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Target profile'
        required: true
        default: 'a55x-A556EXXUIZZI5'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install NDK r29
        run: |
          wget -q https://dl.google.com/android/repository/android-ndk-r29-linux.zip
          unzip -q android-ndk-r29-linux.zip
          echo "ANDROID_NDK_HOME=$PWD/android-ndk-r29" >> $GITHUB_ENV

      - name: Build
        run: |
          make TARGET=${{ github.event.inputs.target }} \
               ANDROID_NDK_HOME=$ANDROID_NDK_HOME -j4

      - uses: actions/upload-artifact@v4
        with:
          name: payload-${{ github.event.inputs.target }}
          path: build/${{ github.event.inputs.target }}/
